name: Build

# Builds the VST3, the AU (macOS) and the standalone app on all three systems.
# Every push and PR builds and keeps the zips as workflow artifacts; a tag
# vX.Y.Z also attaches them to that release (created as a draft if missing).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev

      - name: Web UI and parameter header
        run: |
          npm ci --no-audit --no-fund
          node scripts/gen-plugin.ts
          npm run build

      - name: WebView2 package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$RUNNER_TEMP/webview2"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then extra+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"); fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then extra+=(-DJUCE_WEBVIEW2_PACKAGE_LOCATION="$RUNNER_TEMP/webview2"); fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then extra+=(-G Ninja); fi
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release -DVECTOR_INSTALL=OFF "${extra[@]}"

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME//\//-}"
          out="$PWD/Vector-${ver}-${{ matrix.name }}.zip"
          cd plugin/build/Vector_artefacts/Release
          if [[ "$RUNNER_OS" == "Windows" ]]; then 7z a "$out" VST3 Standalone; else zip -r -y "$out" VST3 Standalone $( [[ "$RUNNER_OS" == "macOS" ]] && echo AU ); fi
          echo "ZIP=$(basename "$out")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Vector-${{ matrix.name }}
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
